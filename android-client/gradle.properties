org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# Skips Gradle's configuration phase on repeat builds. This is the single biggest
# win on inner-loop build time, which is what "does it feel fast in dev" measures.
org.gradle.configuration-cache=true

android.useAndroidX=true

kotlin.code.style=official
kotlin.incremental=true

# ---------------------------------------------------------------------------
# MaxLive brand identity (maxlive branch). merge=ours — do not overwrite from omni.
# In-app name/logo come from the dashboard (/v1/config + sync-brand.ps1).
# ---------------------------------------------------------------------------
APP_NAME=Maxlive
APP_WORDMARK=maxlive
APP_TAGLINE=
APP_ID=app.xani
# The version this build reports and shows in the drawer, and the row the
# dashboard's App versions table turns on or off. Release builds pass their own
# with -PAPP_VERSION=9.1.2; this is the fallback for a plain debug build.
APP_VERSION=9.1.2
SPLASH_MIN_MS=900
API_BASE_URL=https://api.smilee.online
# Production Google Sign-In (release APK package app.xani).
# Web client = token audience (baked into APK + auth.google_client_ids on server).
GOOGLE_WEB_CLIENT_ID=478634587205-js6vd3832ag5sdtkndi9b9cjt2ad6feg.apps.googleusercontent.com
GOOGLE_WEB_CLIENT_ID_RELEASE=478634587205-js6vd3832ag5sdtkndi9b9cjt2ad6feg.apps.googleusercontent.com
# Android OAuth clients in Google Cloud (package + SHA-1) — not baked into APK.
GOOGLE_ANDROID_CLIENT_ID=478634587205-3ij5egmern9d58ch0qvmnqu0hlprd7tc.apps.googleusercontent.com
GOOGLE_ANDROID_CLIENT_ID_RELEASE=478634587205-2vp4lkjsam09bqvuu2736bjudi028ahi.apps.googleusercontent.com
# Compiles real WebRTC + LiveKit (src/rtc). Without this the stub APK shows
# "Calling isn't available on this build".
XANI_RTC=1
